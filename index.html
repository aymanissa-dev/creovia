<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1D14">
<title>Creovia — Your Entire Creative World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@400;500;600;700&family=Great+Vibes&family=Pinyon+Script&family=Monoton&family=Playfair+Display:ital,wght@1,700&family=Bungee+Shade&family=Pacifico&family=Cinzel+Decorative:wght@700&family=Rubik+Glitch&family=Abril+Fatface&family=Permanent+Marker&family=UnifrakturMaguntia&family=Satisfy&family=Rampart+One&family=Alex+Brush&display=swap">
<style>
/* Creovia design system */
:root {
  --cream: #FBF6EE; --cream2: #F5ECDF; --beige: #EADBC8; --sand: #D8C1A2; --brown: #7A4E2D; --brown2: #A0693F; --ink: #2B1D14; --muted: #8A7462; --line: rgba(43, 29, 20, .1);
  --white: #fff; --hub: #FF6B4A; --hub2: #FFB86B; --hubInk: #fff;
  --r: 22px; --r-sm: 14px; --shadow: 0 1px 2px rgba(43, 29, 20, .06), 0 8px 28px rgba(43, 29, 20, .08); --shadow-lg: 0 18px 60px rgba(43, 29, 20, .18);
  --display: 'Fraunces', Georgia, serif; --ui: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --rail: 0px; --top: 60px; --bottom: 72px;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--ui); color: var(--ink); background: var(--cream); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.ico { width: 22px; height: 22px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--hub); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--hub2); }

/* ---------- hub colours ---------- */
body[data-hub] { --hub: var(--c1); --hub2: var(--c2); }

/* ---------- shell ---------- */
.app { min-height: 100dvh; }
.rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 40; height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 14px; padding-top: env(safe-area-inset-top); background: rgba(251, 246, 238, .82); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--line); }
.topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--hub), var(--hub2)); transform-origin: left; animation: barIn .8s var(--ease); }
@keyframes barIn { from { transform: scaleX(0); } }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: .02em; text-decoration: none; }
.logo-mark { width: 32px; height: 32px; border-radius: 11px; background: conic-gradient(from 200deg, #FF6B4A, #E8457F, #7B5CFF, #33C6FF, #1F9D63, #FFC857, #FF6B4A); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 19px; font-weight: 700; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); animation: spinHue 14s linear infinite; }
@keyframes spinHue { to { filter: hue-rotate(360deg); } }
.topbar .hub-title { font-weight: 600; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; transition: background .2s, transform .2s var(--spring); position: relative; }
.icon-btn:hover { background: rgba(43, 29, 20, .06); } .icon-btn:active { transform: scale(.9); }
.badge-dot { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--hub); box-shadow: 0 0 0 2px var(--cream); }
main#view { padding: 16px 14px calc(var(--bottom) + 28px + env(safe-area-inset-bottom)); max-width: 1180px; margin: 0 auto; min-height: calc(100dvh - var(--top)); }
.view-enter { animation: viewIn .55s var(--ease) backwards; }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }

.bottomnav { position: fixed; z-index: 45; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 62px; display: flex; align-items: center; justify-content: space-around; background: rgba(43, 29, 20, .92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 24px; box-shadow: var(--shadow-lg); color: #EADBC8; }
.bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; padding: 6px 10px; border-radius: 16px; transition: color .25s, transform .25s var(--spring); min-width: 54px; }
.bottomnav button.on { color: #fff; }
.bottomnav button.on .ico { color: var(--hub2); transform: translateY(-1px) scale(1.08); }
.bottomnav .create { width: 52px; height: 52px; min-width: 0; border-radius: 18px; background: conic-gradient(from 0deg, #FF6B4A, #E8457F, #7B5CFF, #33C6FF, #FFC857, #FF6B4A); color: #fff; box-shadow: 0 6px 20px rgba(232, 69, 127, .45); transform: translateY(-10px); animation: spinHue 10s linear infinite; }
.bottomnav .create .ico { width: 26px; height: 26px; }
body.dark-hub .bottomnav { background: rgba(10, 6, 20, .85); }

@media (min-width: 900px) {
  :root { --rail: 232px; --bottom: 0px; }
  .bottomnav { display: none; }
  .rail { display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; width: var(--rail); z-index: 41; background: var(--ink); color: #EADBC8; padding: 18px 12px; overflow-y: auto; scrollbar-width: none; }
  .rail .brand { color: #fff; padding: 4px 8px 18px; }
  .rail a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; text-decoration: none; font-size: 14.5px; font-weight: 500; position: relative; transition: background .2s, color .2s; margin-bottom: 2px; }
  .rail a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .rail a .dot { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; flex: none; }
  .rail a .dot .ico { width: 17px; height: 17px; }
  .rail a.on { background: rgba(255, 255, 255, .1); color: #fff; }
  .rail a.on::before { content: ''; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: linear-gradient(var(--a), var(--b)); }
  .rail .rail-create { margin: 6px 0 14px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 16px; font-weight: 600; color: #fff; background: linear-gradient(120deg, #FF6B4A, #E8457F, #7B5CFF); background-size: 200% 100%; animation: slideBg 6s ease infinite alternate; }
  .rail .rail-foot { margin-top: auto; padding-top: 14px; font-size: 12px; color: #A89380; }
  .topbar, main#view { margin-left: var(--rail); }
  main#view { padding: 22px 28px 48px; }
  .topbar .brand { display: none; }
}
@keyframes slideBg { to { background-position: 100% 0; } }
body.dark-hub { background: #0d0816; color: #f4eefc; }
body.dark-hub .topbar { background: rgba(13, 8, 22, .7); border-color: rgba(255, 255, 255, .08); color: #fff; }
body.dark-hub .topbar .hub-title { color: #bfb3d6; }

/* ---------- hub hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 26px 22px; color: #fff; background: linear-gradient(130deg, var(--hub), var(--hub2)); box-shadow: 0 18px 50px -18px var(--hub); margin-bottom: 20px; isolation: isolate; }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 5.4vw, 46px); line-height: 1.02; margin: 0 0 8px; letter-spacing: -.01em; }
.hero p { margin: 0; opacity: .92; max-width: 560px; font-size: 15.5px; }
.hero .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .35; z-index: -1; animation: float 9s ease-in-out infinite; }
.hero .blob.b1 { width: 220px; height: 220px; right: -60px; top: -80px; background: radial-gradient(circle at 30% 30%, #fff, transparent 70%); }
.hero .blob.b2 { width: 160px; height: 160px; right: 22%; bottom: -90px; background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .9), transparent 70%); animation-delay: -3s; }
.hero .blob.b3 { width: 90px; height: 90px; left: 55%; top: 10px; background: radial-gradient(circle, rgba(255, 255, 255, .7), transparent 70%); animation-delay: -6s; }
.hero .hero-art { position: absolute; right: 0; top: 0; bottom: 0; width: 42%; z-index: -1; mask-image: linear-gradient(90deg, transparent, #000 60%); -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); opacity: .55; object-fit: cover; height: 100%; }
.hero .hero-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
@keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-14px, 12px) scale(1.08); } }
.hero.compact { padding: 20px; }
.hero.compact h1 { font-size: clamp(24px, 4.6vw, 36px); }

/* ---------- typography & sections ---------- */
.sec { margin: 26px 0 12px; display: flex; align-items: end; justify-content: space-between; gap: 10px; }
.sec h2 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.sec .more { font-size: 13.5px; font-weight: 600; color: var(--hub); }
body.dark-hub .sec .more { color: var(--hub2); }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
.label-demo { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: rgba(43, 29, 20, .08); color: var(--muted); }
.label-demo.on-dark { background: rgba(255, 255, 255, .18); color: #fff; }
.label-live { background: rgba(31, 157, 99, .14); color: #137a4b; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--cream2); border: 1px dashed var(--sand); font-size: 13.5px; color: #5c4635; }
.note .ico { color: var(--brown); margin-top: 1px; }

/* ---------- buttons, inputs, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 14px; font-weight: 600; font-size: 14.5px; background: var(--ink); color: #fff; transition: transform .2s var(--spring), box-shadow .2s, opacity .2s; white-space: nowrap; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.hub { background: linear-gradient(120deg, var(--hub), var(--hub2)); color: #fff; box-shadow: 0 8px 22px -8px var(--hub); }
.btn.light { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.btn.glass { background: rgba(255, 255, 255, .22); color: #fff; backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35); }
.btn.sm { height: 34px; padding: 0 13px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn.danger { background: #C0392B; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
.chip.on { background: var(--ink); color: #fff; box-shadow: none; }
body[data-hub] .chip.on { background: linear-gradient(120deg, var(--hub), var(--hub2)); }
body.dark-hub .chip { background: rgba(255, 255, 255, .08); box-shadow: none; color: #eee; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; min-height: 46px; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; outline: none; transition: border-color .2s, box-shadow .2s; }
.input:focus { border-color: var(--hub); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hub) 18%, transparent); }
textarea.input { resize: vertical; min-height: 92px; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; }
.toggle { position: relative; width: 50px; height: 30px; border-radius: 99px; background: var(--beige); transition: background .25s; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .3s var(--spring); }
.toggle.on { background: linear-gradient(120deg, var(--hub), var(--hub2)); } .toggle.on::after { transform: translateX(20px); }

/* ---------- cards ---------- */
.card { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
body.dark-hub .card { background: #1a1228; box-shadow: none; }
.pad { padding: 16px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.grid.sm { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.grid.xs { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; flex: none; }
.rise { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.lift { transition: transform .35s var(--ease), box-shadow .35s; } .lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

/* avatars */
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--display); position: relative; overflow: hidden; background: linear-gradient(135deg, hsl(var(--h), 75%, 58%), hsl(calc(var(--h) + 50), 80%, 50%)); }
.av img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.av.lg { width: 92px; height: 92px; font-size: 36px; box-shadow: 0 0 0 4px #fff, var(--shadow); }
.av.sm { width: 30px; height: 30px; font-size: 12px; }
.av.ring { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--hub); }
.pro-badge { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(135deg, #F6D98B, #C8913E); color: #fff; vertical-align: -2px; margin-left: 3px; }
.pro-badge .ico { width: 11px; height: 11px; }

/* creator card */
.creator { width: 168px; padding: 16px 12px; text-align: center; display: grid; justify-items: center; gap: 8px; position: relative; }
.creator .cover { position: absolute; inset: 0 0 auto 0; height: 62px; object-fit: cover; width: 100%; }
.creator .av { margin-top: 18px; box-shadow: 0 0 0 3px #fff; width: 58px; height: 58px; font-size: 22px; }
.creator b { font-size: 14px; } .creator .muted { font-size: 12px; margin-top: -6px; }

/* post card (feed) */
.feed { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }
.post header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.post header .who { min-width: 0; flex: 1; line-height: 1.2; }
.post header .who b { display: block; font-size: 14.5px; cursor: pointer; }
.post header .who span { font-size: 12.5px; color: var(--muted); }
.media { position: relative; background: var(--cream2); overflow: hidden; cursor: zoom-in; }
.media > img, .media > video, .media > svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.post .media { aspect-ratio: 4/5; max-height: 72vh; }
.media.manga-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #111; aspect-ratio: auto; max-height: none; }
.media.manga-strip img { aspect-ratio: 1; }
.post .actions { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; }
.post .actions button { display: inline-flex; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; font-weight: 600; font-size: 13.5px; transition: transform .2s var(--spring); }
.post .actions button:active { transform: scale(.85); }
.post .caption { padding: 4px 16px 16px; margin: 0; font-size: 14.5px; }
.post .caption .tag { color: var(--hub); font-weight: 600; }
.liked .ico { fill: #FF2E63; color: #FF2E63; animation: pop .45s var(--spring); }
.saved-on .ico { fill: currentColor; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
.heart-burst { position: absolute; pointer-events: none; width: 110px; height: 110px; margin: -55px 0 0 -55px; color: #fff; z-index: 5; animation: burst .9s var(--ease) forwards; filter: drop-shadow(0 6px 18px rgba(255, 46, 99, .6)); }
.heart-burst .ico { width: 100%; height: 100%; fill: #FF2E63; color: #FF2E63; }
@keyframes burst { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 25% { transform: scale(1.15) rotate(6deg); opacity: 1; } 60% { transform: scale(.95); opacity: 1; } 100% { transform: scale(1.3) translateY(-40px); opacity: 0; } }

/* masonry tiles */
.masonry { columns: 2 160px; column-gap: 12px; }
@media (min-width: 700px) { .masonry { columns: 3 200px; } }
@media (min-width: 1100px) { .masonry { columns: 4 220px; } }
.tile { break-inside: avoid; margin-bottom: 12px; border-radius: 18px; overflow: hidden; position: relative; background: #fff; box-shadow: var(--shadow); cursor: zoom-in; display: block; }
.tile img, .tile video { width: 100%; display: block; }
.tile .ov { position: absolute; inset: auto 0 0 0; padding: 30px 10px 10px; background: linear-gradient(transparent, rgba(0, 0, 0, .55)); color: #fff; display: flex; align-items: center; gap: 8px; font-size: 12.5px; opacity: .95; }
.tile .ov b { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .save { position: absolute; top: 8px; right: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--hub); color: #fff; font-weight: 700; font-size: 12.5px; opacity: 0; transform: translateY(-6px); transition: all .25s var(--ease); }
.tile:hover .save, .tile:focus-within .save, .tile .save.done { opacity: 1; transform: none; }
@media (hover: none) { .tile .save { opacity: 1; transform: none; } }
.tile .save.done { background: var(--ink); }
.tile .kind { position: absolute; top: 8px; left: 8px; }
.tile.r-tall img { aspect-ratio: 3/4.4; object-fit: cover; } .tile.r-sq img { aspect-ratio: 1; object-fit: cover; } .tile.r-wide img { aspect-ratio: 4/3; object-fit: cover; } .tile.r-por img { aspect-ratio: 4/5; object-fit: cover; }

/* tabs */
.tabs { display: flex; gap: 6px; padding: 5px; background: rgba(43, 29, 20, .05); border-radius: 16px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
.tabs button { flex: 1 0 auto; height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 600; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all .25s var(--ease); }
.tabs button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.tabs button.on .ico { color: var(--hub); }
body.dark-hub .tabs { background: rgba(255, 255, 255, .06); } body.dark-hub .tabs button.on { background: rgba(255, 255, 255, .14); color: #fff; }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 700px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { padding: 16px; border-radius: 20px; background: #fff; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat .k { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .v { font-family: var(--display); font-size: 30px; font-weight: 600; margin-top: 4px; letter-spacing: -.02em; }
.stat .s { font-size: 12px; color: var(--muted); }
.stat::after { content: ''; position: absolute; right: -24px; top: -24px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(var(--hub2), transparent 70%); opacity: .35; }

/* progress */
.bar { height: 8px; border-radius: 99px; background: var(--beige); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--hub), var(--hub2)); transition: width .8s var(--ease); }

/* hub tiles (Hubs sheet + home) */
.hubgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.hubtile { position: relative; aspect-ratio: 1.15; border-radius: 22px; padding: 14px; color: #fff; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; text-align: left; background: linear-gradient(140deg, var(--a), var(--b)); box-shadow: 0 12px 26px -14px var(--a); transition: transform .35s var(--spring); isolation: isolate; text-decoration: none; }
.hubtile:hover { transform: translateY(-4px) rotate(-.6deg); } .hubtile:active { transform: scale(.96); }
.hubtile .ico { width: 30px; height: 30px; }
.hubtile b { font-size: 15px; line-height: 1.15; } .hubtile small { font-size: 11.5px; opacity: .88; line-height: 1.25; display: block; margin-top: 3px; }
.hubtile::before { content: ''; position: absolute; width: 120px; height: 120px; right: -40px; top: -40px; border-radius: 50%; background: rgba(255, 255, 255, .22); z-index: -1; transition: transform .6s var(--ease); }
.hubtile:hover::before { transform: scale(1.5); }

/* sheet / modal */
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(20, 12, 6, .5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .3s; }
.sheet { position: fixed; z-index: 81; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto; background: var(--cream); border-radius: 26px 26px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom)); animation: sheetUp .45s var(--ease); box-shadow: var(--shadow-lg); color: var(--ink); overscroll-behavior: contain; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--sand); margin: 2px auto 12px; }
.sheet h3 { font-family: var(--display); font-size: 22px; margin: 4px 0 14px; font-weight: 600; }
.sheet .sheet-x { position: sticky; top: 0; float: right; margin: -4px -6px 0 0; z-index: 2; background: var(--cream); }
.sheet.wide { max-width: none; }
@media (min-width: 760px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(620px, 92vw); transform: translate(-50%, -50%); border-radius: 26px; max-height: 88dvh; animation: modalIn .4s var(--ease); padding: 18px 24px 24px; }
  .sheet.wide { width: min(980px, 94vw); }
  .sheet .grab { display: none; }
}
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes modalIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.96); } }
@keyframes fade { from { opacity: 0; } }
.closing .sheet { animation: sheetDown .3s var(--ease) forwards; } .closing.scrim { animation: fade .3s reverse forwards; }
@keyframes sheetDown { to { transform: translateY(100%); opacity: 0; } }
@media (min-width: 760px) { .closing .sheet { animation: fade .25s reverse forwards; } }
.menu-list { display: grid; gap: 4px; }
.menu-list button, .menu-list a { display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 14px; text-align: left; font-weight: 500; text-decoration: none; }
.menu-list button:hover, .menu-list a:hover { background: rgba(43, 29, 20, .05); }
.menu-list .danger { color: #B3261E; }

/* create sheet tiles */
.create-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .create-grid { grid-template-columns: repeat(3, 1fr); } }
.create-grid button { padding: 16px 12px; border-radius: 18px; text-align: left; color: #fff; background: linear-gradient(140deg, var(--a), var(--b)); display: grid; gap: 8px; font-weight: 600; transition: transform .25s var(--spring); }
.create-grid button small { font-weight: 400; opacity: .9; font-size: 12px; }
.create-grid button:active { transform: scale(.95); }

/* toast */
#toasts { position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom) + 26px + env(safe-area-inset-bottom)); display: grid; gap: 8px; width: min(440px, 92vw); pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 16px; box-shadow: var(--shadow-lg); font-size: 14px; display: flex; gap: 10px; align-items: center; animation: toastIn .45s var(--spring); pointer-events: auto; }
.toast.warn { background: #7c2d12; } .toast.ok .ico { color: #7DE2D1; }
.toast.out { animation: fade .3s reverse forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.95); } }

/* comments */
.comments { display: grid; gap: 12px; margin: 12px 0; }
.cmt { display: flex; gap: 10px; align-items: flex-start; }
.cmt .bubble { background: #fff; border-radius: 4px 16px 16px 16px; padding: 8px 12px; box-shadow: var(--shadow); flex: 1; font-size: 14px; }
.cmt .bubble b { font-size: 13px; display: block; }
.composer-bar { display: flex; gap: 8px; align-items: center; position: sticky; bottom: -24px; background: var(--cream); padding: 10px 0; }

/* lightbox detail */
.detail { display: grid; gap: 16px; }
@media (min-width: 760px) { .detail { grid-template-columns: 1.1fr 1fr; align-items: start; } }
.detail .media { border-radius: 18px; aspect-ratio: 4/5; cursor: default; }
.detail .media.manga-strip { aspect-ratio: auto; }

/* empty state */
.empty { text-align: center; padding: 34px 18px; color: var(--muted); }
.empty .art { width: 120px; height: 120px; border-radius: 30px; margin: 0 auto 12px; overflow: hidden; animation: float 6s ease-in-out infinite; }

/* skeleton */
.skel { background: linear-gradient(100deg, var(--beige) 30%, var(--cream2) 50%, var(--beige) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; border-radius: 16px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* marquee */
.marquee { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee .track { display: flex; gap: 12px; width: max-content; animation: marquee 40s linear infinite; }
.marquee:hover .track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
.mag { display: grid; gap: 2px; padding: 14px 18px; min-width: 170px; border-radius: 18px; text-decoration: none; background: #fff; box-shadow: var(--shadow); transition: transform .3s var(--spring); }
.mag:hover { transform: translateY(-3px) rotate(-1deg); }
.mag b { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.mag span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.mag span .ico { width: 13px; height: 13px; }

/* trending ticker */
.ticker { display: flex; gap: 8px; flex-wrap: wrap; }
.ticker button { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: #fff; background: hsl(var(--h), 70%, 52%); transition: transform .2s var(--spring); }
.ticker button:hover { transform: scale(1.06) rotate(-2deg); }

/* ---------- Flow (TikTok-style) ---------- */
.flow { position: fixed; inset: var(--top) 0 0 var(--rail); background: #000; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; z-index: 1; }
.flow::-webkit-scrollbar { display: none; }
.reel { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; }
.reel .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.reel .bgblur { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(30px) brightness(.55); }
.reel .frame { position: relative; height: 100%; max-width: min(100%, 62dvh); aspect-ratio: 9/16; overflow: hidden; }
.reel .frame > img, .reel .frame > video { width: 100%; height: 100%; object-fit: cover; }
.reel canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
.reel .shade { position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0, 0, 0, .7)); pointer-events: none; }
.reel .info { position: absolute; left: 14px; right: 84px; bottom: calc(var(--bottom) + 26px + env(safe-area-inset-bottom)); z-index: 3; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.reel .info b { font-size: 16px; cursor: pointer; }
.reel .info p { margin: 6px 0 10px; font-size: 14.5px; }
.reel .sound { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; opacity: .9; max-width: 100%; overflow: hidden; }
.reel .sound .ico { width: 15px; height: 15px; animation: spin 4s linear infinite; }
.reel .rail2 { position: absolute; right: 10px; bottom: calc(var(--bottom) + 24px + env(safe-area-inset-bottom)); z-index: 3; display: grid; gap: 14px; justify-items: center; }
.reel .rail2 button { display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.reel .rail2 .ico { width: 34px; height: 34px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .5)); transition: transform .2s var(--spring); }
.reel .rail2 button:active .ico { transform: scale(.8); }
.reel .rail2 .av { width: 48px; height: 48px; box-shadow: 0 0 0 2px #fff; }
.reel .rail2 .plus { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: #FF2E63; display: grid; place-items: center; }
.reel .rail2 .plus .ico { width: 14px; height: 14px; filter: none; }
.reel .disc { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 8px solid #222; animation: spin 5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.flow-top { position: fixed; z-index: 5; top: calc(var(--top) + 10px); left: calc(var(--rail) + 50%); transform: translateX(-50%); display: flex; gap: 18px; color: #fff; font-weight: 700; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.flow-top button { opacity: .65; padding: 4px 2px; border-bottom: 2px solid transparent; }
.flow-top button.on { opacity: 1; border-color: #fff; }
.m-zoom { animation: kb 18s ease-in-out infinite alternate; } .m-drift { animation: drift 14s ease-in-out infinite alternate; }
.m-spin { animation: spinSlow 40s linear infinite; scale: 1.5; } .m-hue { animation: hue 10s linear infinite, kb 20s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.25) translate(-3%, -2%); } }
@keyframes drift { from { transform: scale(1.2) translate(-6%, 0); } to { transform: scale(1.2) translate(6%, -3%); } }
@keyframes spinSlow { to { transform: rotate(360deg); } }
@keyframes hue { to { filter: hue-rotate(360deg); } }

/* ---------- AI Zone ---------- */
.ai-chat { display: grid; gap: 12px; padding-bottom: 8px; }
.msg { max-width: 88%; padding: 12px 15px; border-radius: 20px; font-size: 14.5px; line-height: 1.5; animation: rise .4s var(--ease); white-space: normal; overflow-wrap: anywhere; }
.msg.u { justify-self: end; background: linear-gradient(120deg, var(--hub), var(--hub2)); color: #fff; border-bottom-right-radius: 6px; }
.msg.a { justify-self: start; background: #fff; box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.msg.a p { margin: 0 0 8px; } .msg.a p:last-child { margin: 0; } .msg.a ul { margin: 4px 0 8px; padding-left: 20px; }
.typing span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--hub); margin-right: 4px; animation: bounce 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }
.ai-input { display: flex; gap: 8px; position: sticky; bottom: calc(var(--bottom) + 14px + env(safe-area-inset-bottom)); background: var(--cream); padding: 10px 0 0; }
.swatches { display: flex; border-radius: 18px; overflow: hidden; height: 110px; box-shadow: var(--shadow); }
.swatches div { flex: 1; display: flex; align-items: flex-end; padding: 8px; font-size: 11px; font-weight: 700; transition: flex .35s var(--ease); cursor: pointer; }
.swatches div:hover { flex: 1.6; }
.gen-out { aspect-ratio: 4/5; border-radius: 22px; overflow: hidden; background: var(--cream2); position: relative; display: grid; place-items: center; box-shadow: var(--shadow); }
.gen-out img { width: 100%; height: 100%; object-fit: cover; animation: reveal 1s var(--ease); }
@keyframes reveal { from { clip-path: circle(0 at 50% 50%); filter: blur(8px); } to { clip-path: circle(75% at 50% 50%); } }
.orb { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(var(--hub), var(--hub2), #FF5FA2, var(--hub)); animation: spin 1.4s linear infinite; filter: blur(1px); box-shadow: 0 0 40px var(--hub); }
.story-stage { position: relative; aspect-ratio: 16/9; border-radius: 22px; overflow: hidden; background: #000; color: #fff; }
.story-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
.story-stage img.on { opacity: 1; animation: kb 6s ease-out forwards; }
.story-stage .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 18px 16px; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); font-family: var(--display); font-size: clamp(16px, 2.6vw, 24px); }

/* ---------- sketch pad ---------- */
.sketch-wrap { display: grid; gap: 12px; }
.sketch-canvas { width: 100%; aspect-ratio: 4/5; max-height: 70dvh; border-radius: 20px; background: #fff; box-shadow: var(--shadow); touch-action: none; display: block; cursor: crosshair; }
@media (min-width: 900px) { .sketch-wrap { grid-template-columns: 1fr 260px; align-items: start; } .sketch-canvas { aspect-ratio: 4/3; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatch { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .08); transition: transform .2s var(--spring); }
.swatch.on { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
.tool-b { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: #fff; box-shadow: var(--shadow); }
.tool-b.on { background: var(--ink); color: #fff; }
input[type=range] { accent-color: var(--hub); width: 100%; }

/* tools hub */
.toolcard { padding: 16px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.toolcard .tl { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 700; font-size: 22px; box-shadow: 0 8px 18px -8px var(--tc); background: var(--tc); }
.toolcard .tag { position: absolute; top: 14px; right: 14px; }

/* manga studio */
.manga-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; background: #111; border-radius: 16px; }
.manga-grid .panel { position: relative; aspect-ratio: 1; cursor: pointer; border-radius: 4px; overflow: hidden; transition: outline .2s; outline: 3px solid transparent; outline-offset: -3px; }
.manga-grid .panel.on { outline-color: var(--hub); }
.manga-grid .panel img { width: 100%; height: 100%; }
.sakura-fall { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
.sakura-fall i { position: absolute; top: -20px; width: 12px; height: 9px; background: #ffd1e3; border-radius: 12px 0 12px 0; animation: petal linear infinite; opacity: .9; }
@keyframes petal { to { transform: translate(-80px, 360px) rotate(540deg); opacity: 0; } }

/* product */
.product .media { aspect-ratio: 1; cursor: pointer; }
.product .body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.product .price { font-family: var(--display); font-weight: 600; font-size: 18px; }

/* competitions */
.comp { position: relative; overflow: hidden; color: #fff; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; border-radius: var(--r); box-shadow: var(--shadow); cursor: pointer; isolation: isolate; }
.comp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1.2s var(--ease); }
.comp:hover img { transform: scale(1.06); }
.comp::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 20%, rgba(0, 0, 0, .78)); }
.comp h3 { font-family: var(--display); margin: 6px 0 4px; font-size: 22px; font-weight: 600; }
.countdown { display: inline-flex; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .2); backdrop-filter: blur(6px); }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 10px 0; }
.podium > div { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 12.5px; }
.podium .block { width: 76px; border-radius: 14px 14px 0 0; display: grid; place-items: center; font-family: var(--display); font-size: 26px; color: #fff; }

/* chart */
.chart { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
.chart .col { flex: 1; display: grid; justify-items: center; gap: 6px; height: 100%; align-content: end; }
.chart .col i { width: 100%; max-width: 26px; border-radius: 8px 8px 3px 3px; background: linear-gradient(var(--hub2), var(--hub)); transform-origin: bottom; animation: grow .9s var(--ease) both; animation-delay: calc(var(--i) * 40ms); min-height: 3px; }
.chart .col span { font-size: 10.5px; color: var(--muted); }
@keyframes grow { from { transform: scaleY(0); } }

/* profile */
.profile-cover { height: 170px; border-radius: 26px; overflow: hidden; position: relative; }
.profile-cover img { width: 100%; height: 100%; object-fit: cover; }
.profile-head { display: flex; gap: 16px; align-items: flex-end; margin: -46px 16px 0; position: relative; flex-wrap: wrap; }
.profile-head .names { flex: 1; min-width: 180px; padding-bottom: 4px; }
.profile-head h1 { font-family: var(--display); font-size: 26px; margin: 0; font-weight: 600; }
.pstats { display: flex; gap: 22px; margin: 14px 16px; }
.pstats b { font-family: var(--display); font-size: 20px; display: block; }
.pstats span { font-size: 12.5px; color: var(--muted); }
.board-cover { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; aspect-ratio: 1.3; border-radius: 18px; overflow: hidden; background: var(--beige); }
.board-cover > * { width: 100%; height: 100%; object-fit: cover; }
.board-cover > :first-child { grid-row: span 2; }
.collage { columns: 2 140px; column-gap: 8px; }
.collage > * { break-inside: avoid; margin-bottom: 8px; border-radius: 14px; overflow: hidden; position: relative; }
.note-pin { padding: 18px; font-family: var(--display); font-size: 18px; line-height: 1.25; color: var(--ink); }
.color-pin { height: 110px; display: flex; align-items: flex-end; padding: 8px; font-weight: 700; font-size: 12px; }

/* welcome / intro overlay */
#stage { position: fixed; inset: 0; z-index: 200; background: #0b0710; color: #fff; overflow: hidden; }
#stage.fade-out { animation: stageOut 1.6s var(--ease) forwards; }
@keyframes stageOut { to { opacity: 0; visibility: hidden; filter: blur(10px); } }
.skip { position: absolute; z-index: 20; top: calc(14px + env(safe-area-inset-top)); right: 14px; height: 36px; padding: 0 16px; border-radius: 99px; background: rgba(255, 255, 255, .14); color: #fff; font-weight: 600; font-size: 13px; backdrop-filter: blur(8px); }
.montage { position: absolute; inset: 0; }
.montage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.montage img.show { animation: cut 1.05s var(--ease) forwards; }
@keyframes cut { 0% { opacity: 0; transform: scale(1.35) rotate(-2deg); clip-path: inset(40% 40% 40% 40% round 40px); } 30% { opacity: 1; clip-path: inset(0 0 0 0 round 0); } 100% { opacity: 1; transform: scale(1) rotate(0); clip-path: inset(0 0 0 0); } }
.montage .label { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); font-family: var(--display); font-style: italic; font-size: clamp(18px, 3vw, 28px); letter-spacing: .04em; text-shadow: 0 2px 20px rgba(0, 0, 0, .6); white-space: nowrap; animation: labelIn .9s var(--ease) both; }
@keyframes labelIn { from { opacity: 0; transform: translate(-50%, 16px); letter-spacing: .5em; } }
.wall { position: absolute; inset: 0; }
.wall .w { position: absolute; font-weight: 700; white-space: nowrap; transform: translate(-50%, -50%); opacity: .9; }
.letter { display: inline-block; opacity: 0; animation: letterPop .55s var(--spring) forwards; }
@keyframes letterPop { 0% { opacity: 0; transform: translateY(.6em) scale(.2) rotate(-25deg); filter: blur(6px); } 60% { opacity: 1; transform: translateY(-.08em) scale(1.25) rotate(6deg); filter: blur(0); } 100% { opacity: 1; transform: none; } }
.whole { animation: wholeIn .7s var(--ease) forwards; opacity: 0; display: inline-block; }
@keyframes wholeIn { from { opacity: 0; clip-path: inset(0 0 0 100%); filter: blur(8px); } to { opacity: 1; clip-path: inset(0); } }
.center-word { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 3; }
.center-word .big { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 11vw, 132px); line-height: 1; text-shadow: 0 6px 40px rgba(0, 0, 0, .5); white-space: nowrap; }
.center-word .lang { margin-top: 10px; font-size: 14px; letter-spacing: .3em; text-transform: uppercase; opacity: .7; }
.logo-in { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; }
.logo-in .word { font-family: var(--display); font-weight: 700; font-size: clamp(60px, 21vw, 340px); line-height: .9; letter-spacing: -.03em; background-size: cover; background-position: center; -webkit-background-clip: text; background-clip: text; color: transparent; animation: logoGrow 2.6s var(--ease) both; white-space: nowrap; }
.logo-in .word .letter { animation-duration: .7s; }
@keyframes logoGrow { 0% { transform: scale(.25); filter: blur(12px); } 60% { filter: blur(0); } 100% { transform: scale(1); } }
.logo-in .tag { font-family: var(--display); font-style: italic; font-size: clamp(16px, 3vw, 30px); letter-spacing: .12em; margin-top: 4px; text-align: center; color: #F5E6D3; animation: labelIn 1.2s var(--ease) 1.4s both; }
.logo-in .inner { text-align: center; }
.stage-bg { position: absolute; inset: -10%; background: radial-gradient(60% 50% at 20% 20%, #E8457F55, transparent), radial-gradient(50% 50% at 80% 30%, #7B5CFF55, transparent), radial-gradient(60% 60% at 50% 90%, #FFB86B44, transparent); animation: float 12s ease-in-out infinite; }

/* login */
.login { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 10; }
.login .art-bg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px; opacity: .5; transform: rotate(-8deg) scale(1.3); }
.login .art-bg img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 16px; animation: float 10s ease-in-out infinite; animation-delay: calc(var(--i) * -.7s); }
.login .art-bg::after { content: ''; position: absolute; inset: -50%; background: radial-gradient(circle, rgba(11, 7, 16, .4), #0b0710 65%); }
.glass-card { position: relative; width: min(440px, 100%); padding: 28px 24px; border-radius: 30px; background: rgba(251, 246, 238, .1); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2), 0 30px 80px rgba(0, 0, 0, .5); animation: rise .9s var(--ease) both; max-height: 92dvh; overflow-y: auto; }
.glass-card h1 { font-family: var(--display); font-size: 40px; margin: 6px 0 2px; font-weight: 600; letter-spacing: -.01em; }
.glass-card .input { background: rgba(255, 255, 255, .92); color: var(--ink); }
.glass-card .field > span { color: #e8dccd; }
.glass-card .chip { background: rgba(255, 255, 255, .12); color: #fff; box-shadow: none; }
.glass-card .chip.on { background: #fff; color: var(--ink); }
.glass-card .note { background: rgba(255, 255, 255, .08); color: #e8dccd; border-color: rgba(255, 255, 255, .2); }
.glass-card .note .ico { color: #FFB86B; }
.hue-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.hue-pick button { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, hsl(var(--h), 75%, 58%), hsl(calc(var(--h) + 50), 80%, 50%)); transition: transform .2s var(--spring); }
.hue-pick button.on { transform: scale(1.2); box-shadow: 0 0 0 3px #fff; }

/* welcome back */
.wb { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 5; }
.wb .name { font-size: clamp(54px, 13vw, 150px); line-height: 1.1; min-height: 1.3em; background: linear-gradient(100deg, #FFD36E, #FF8FAB, #C77DFF, #7DE2D1, #FFD36E); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: slideBg 4s linear infinite alternate; transition: filter .25s; padding: 0 .2em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: clip; }
.wb .name.swap { filter: blur(10px); }
.wb .speech { max-width: 720px; font-family: var(--display); font-size: clamp(18px, 3.2vw, 30px); line-height: 1.35; margin-top: 18px; color: #F5E6D3; min-height: 3em; }
.wb .speech span { opacity: 0; display: inline-block; animation: wordIn .5s var(--ease) forwards; margin-right: .25em; }
@keyframes wordIn { from { opacity: 0; transform: translateY(10px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.voice-wave { display: flex; gap: 4px; height: 26px; align-items: center; margin-top: 18px; opacity: 0; transition: opacity .4s; }
.voice-wave.on { opacity: 1; }
.voice-wave i { width: 4px; border-radius: 4px; background: linear-gradient(#FFD36E, #FF8FAB); animation: wave 1s ease-in-out infinite; height: 6px; }
@keyframes wave { 50% { height: 26px; } }
.showcase { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 0; }
.showcase h2 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 5vw, 48px); text-align: center; margin: 0 16px; animation: labelIn 1s var(--ease) both; }
.showcase .cats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
.showcase .cats span { padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; background: rgba(255, 255, 255, .1); animation: rise .6s var(--ease) both; animation-delay: calc(var(--i) * 120ms + .3s); }
.showreel { display: flex; gap: 14px; width: max-content; animation: marquee 30s linear infinite; }
.showreel figure { margin: 0; width: clamp(150px, 26vw, 240px); position: relative; border-radius: 20px; overflow: hidden; animation: rise .8s var(--ease) both; animation-delay: calc(var(--i) * 80ms); }
.showreel figure img { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
.showreel figcaption { position: absolute; left: 10px; bottom: 10px; font-weight: 700; font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: rgba(0, 0, 0, .45); backdrop-filter: blur(6px); }
.showcase .mags { display: flex; gap: 10px; width: max-content; animation: marquee 36s linear infinite reverse; }
.showcase .mags a { padding: 10px 18px; border-radius: 14px; background: rgba(255, 255, 255, .08); text-decoration: none; font-family: var(--display); font-size: 17px; white-space: nowrap; }
.showcase .enter { align-self: center; margin-top: 4px; animation: rise .8s var(--ease) 1s both; }

/* confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: conf 2.6s cubic-bezier(.2, .6, .4, 1) forwards; }
@keyframes conf { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .2; } }

/* misc */
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--cream2); color: var(--brown); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.cert { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
.lesson { border-radius: 16px; background: #fff; box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
.lesson > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; }
.lesson .num { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--cream2); font-weight: 700; flex: none; }
.lesson.done .num { background: linear-gradient(120deg, var(--hub), var(--hub2)); color: #fff; }
.lesson .body { padding: 0 16px 16px 60px; display: none; }
.lesson.open .body { display: block; animation: rise .4s var(--ease); }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: rgba(31, 157, 99, .12); color: #137a4b; }
.status-pill.local { background: rgba(242, 113, 28, .12); color: #b4530f; }
.status-pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .3; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
body.calm *, body.calm *::before, body.calm *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
body.dark-hub main#view { padding: 0; min-height: 0; }
body.dark-hub .bottomnav { background: rgba(10, 6, 20, .78); }
.post .caption .tag, .caption .tag { color: var(--hub); font-weight: 600; }
.reel .info .tag { color: #fff; font-weight: 700; }
.story-stage { max-width: 820px; }
#aiBody .detail .gen-out { max-width: 460px; width: 100%; }

</style>

<script>
/* js/store.js */
/* Creovia — data layer: claude.ai capabilities (db, user, assets, sample, tts) with an honest local demo fallback */
(function (C) {
  'use strict';
  const COLS = ['profiles', 'posts', 'products', 'acts', 'groups'];
  const privDefaults = () => ({ blocked: [], boards: [], progress: {}, certs: [], ai: { day: '', n: 0 }, toolkit: [], connected: [], hiddenPosts: [], voice: true, reduceMotion: false, dailyDone: {}, chat: [] });
  const S = C.S = {
    mode: 'connecting', uid: null, meName: '', ready: false, ver: 0,
    caps: { db: null, user: null, assets: null, sample: null, tts: null },
    can: { write: true, admin: false, owner: false },
    profiles: {}, posts: {}, products: {}, acts: {}, groups: {}, reports: {},
    mod: { hiddenPosts: [], hiddenUsers: [], dismissed: [] },
    priv: privDefaults(), loaded: {}, note: ''
  };
  C.AI_FREE_PER_DAY = 15;
  C.COMMISSION = { free: .10, pro: .05 };

  /* ---------- events ---------- */
  const subs = new Set(); let emitT;
  S.on = fn => { subs.add(fn); return () => subs.delete(fn); };
  S.emit = () => { S.ver++; clearTimeout(emitT); emitT = setTimeout(() => subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 50); };

  const use = n => (window.claude && typeof window.claude.use === 'function')
    ? Promise.resolve().then(() => window.claude.use(n)).catch(() => null)
    : Promise.resolve(null);
  const safe = async (fn, d) => { try { const v = await fn(); return v === undefined ? d : v; } catch (e) { return d; } };

  /* ---------- init ---------- */
  let loadedResolve; S.whenLoaded = new Promise(r => { loadedResolve = r; });
  S.init = async () => {
    use('assets').then(a => { S.caps.assets = a; S.emit(); });
    use('sample').then(a => { S.caps.sample = a; S.emit(); });
    use('tts').then(a => { S.caps.tts = a; });
    const [db, user] = await Promise.all([use('db'), use('user')]);
    S.caps.db = db; S.caps.user = user;
    let uid = null;
    if (db && user) uid = await safe(() => user.id(), null);
    if (db && uid) {
      S.mode = 'cloud'; S.uid = uid;
      const me = await safe(() => user.me(), null);
      S.meName = (me && me.name) || '';
      S.can.owner = !!(await safe(() => user.isOwner(), false));
      S.can.admin = S.can.owner || !!(await safe(() => user.canEdit(), false));
      const w = await safe(() => user.can('data.write'), null);
      S.can.write = w !== false;
      subscribeCloud(db, uid);
    } else {
      S.mode = 'local';
      S.uid = C.lsGet('localUid', null) || ('local-' + C.uid()); C.lsSet('localUid', S.uid);
      S.can = { write: true, admin: true, owner: true };
      loadLocal(); loadedResolve();
    }
    S.ready = true; S.emit();
  };

  function subscribeCloud(db, uid) {
    const need = new Set([...COLS, 'priv']);
    const done = k => { S.loaded[k] = true; need.delete(k); if (!need.size) loadedResolve(); };
    const timer = setTimeout(() => { S.note = 'Some data is taking a while to load — it may be out of date.'; loadedResolve(); S.emit(); }, 10000);
    const fail = e => { console.warn('db', e); S.note = 'Live data is unavailable right now.'; loadedResolve(); S.emit(); };
    COLS.forEach(col => {
      db.collection(col).onSnapshot(snap => {
        const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
        S[col] = o; if (!snap.metadata.fromCache) done(col); S.emit();
      }, fail);
    });
    db.doc('data/users/' + uid + '/private').onSnapshot(d => {
      if (d.exists) S.priv = { ...privDefaults(), ...d.data() };
      if (!d.metadata.fromCache) done('priv'); S.emit();
    }, fail);
    db.doc('moderation/state').onSnapshot(d => { S.mod = { hiddenPosts: [], hiddenUsers: [], dismissed: [], ...(d.exists ? d.data() : {}) }; S.emit(); }, () => { });
    if (S.can.admin) db.collection('reports').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S.reports = o; S.emit(); }, () => { });
    else db.doc('reports/' + uid).onSnapshot(d => { S.reports = d.exists ? { [uid]: d.data() } : {}; S.emit(); }, () => { });
    S.whenLoaded.then(() => clearTimeout(timer));
  }

  /* ---------- local demo store (this device only) ---------- */
  let local = {};
  function loadLocal() {
    local = C.lsGet('localdb', {});
    COLS.forEach(col => { const d = local[col + '/' + S.uid]; S[col] = d ? { [S.uid]: d } : {}; });
    S.priv = { ...privDefaults(), ...(local['private'] || {}) };
    S.mod = { hiddenPosts: [], hiddenUsers: [], dismissed: [], ...(local['moderation/state'] || {}) };
    const rep = local['reports/' + S.uid]; S.reports = rep ? { [S.uid]: rep } : {};
  }
  function localSave(path, data) {
    const key = path.startsWith('data/users/') ? 'private' : path;
    if (data === null) delete local[key]; else local[key] = data;
    C.lsSet('localdb', local);
  }

  /* ---------- coalesced writes: one in flight per document ---------- */
  const W = {};
  function write(path, data) {
    const size = data ? JSON.stringify(data).length : 0;
    if (size > 250000) { C.toast && C.toast('That’s too large to save. Try fewer or smaller images.', 'warn'); return false; }
    const w = W[path] || (W[path] = { busy: false, next: undefined });
    w.next = data; if (!w.busy) flush(path); return true;
  }
  async function flush(path) {
    const w = W[path]; if (w.next === undefined) { w.busy = false; return; }
    w.busy = true; const d = w.next; w.next = undefined;
    try {
      if (S.mode === 'cloud') { const ref = S.caps.db.doc(path); await (d === null ? ref.delete() : ref.set(d)); }
      else localSave(path, d);
    } catch (e) { onWriteError(e); }
    w.busy = false; if (w.next !== undefined) flush(path);
  }

        <button class="btn sm light" id="cshuf">${icon('wand')} New art</button><button class="btn sm light" id="cnone">No media</button></div>
      <div class="chips" id="cstyles">${C.ART_STYLES.map(x => `<button class="chip ${x === (st.media && st.media.style) ? 'on' : ''}" data-s="${x}">${esc(C.STYLE_LABELS[x])}</button>`).join('')}</div>
      <div id="cmotion" class="chips" ${st.kind === 'reel' ? '' : 'hidden'}>${['zoom', 'drift', 'spin', 'hue'].map(m => `<button class="chip ${m === st.motion ? 'on' : ''}" data-m="${m}">Motion: ${m}</button>`).join('')}</div>
      <label class="field"><span>Caption</span><textarea class="input" id="ctext" maxlength="1000" placeholder="Tell the story behind it… add #tags">${esc(o.text || '')}</textarea></label>
      <div class="row wrap" style="margin:-6px 0 12px"><button class="btn sm ghost" id="cai">${icon('spark')} Write caption with AI</button><span class="tiny muted" id="caimsg"></span></div>
      <div id="ccatw" ${st.kind === 'display' ? '' : 'hidden'}><label class="field"><span>Category</span><select class="input" id="ccat">${C.DISPLAY_CATS.map(c => `<option value="${c.id}" ${c.id === st.cat ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label></div>
      ${myGroups.length ? `<label class="field"><span>Share to a group (optional)</span><select class="input" id="cgroup"><option value="">Everyone</option>${myGroups.map(g => `<option value="${g.id}" ${g.id === st.group ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>` : ''}
      ${st.comp ? `<p class="note">${icon('trophy')} This will be entered into <b>${esc((C.COMPETITIONS.find(c => c.id === st.comp) || {}).title)}</b>.</p>` : ''}
      <p class="tiny muted">${esc(S.storageNote())}</p>
      <button class="btn hub block" id="cpost">${icon('send')} Publish</button>`, { wide: true });
    const q = sel => s.el.querySelector(sel);
    const prev = () => {
      const box = q('#cprev');
      if (!st.media) { box.innerHTML = `<div class="muted small" style="padding:20px;text-align:center">Text-only post</div>`; return; }
      box.innerHTML = st.media.type === 'video' ? `<video src="${esc(st.media.url)}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>` : `<img src="${esc(C.mediaSrc(st.media))}" alt="" class="${st.kind === 'reel' && st.media.type === 'art' ? 'm-' + st.motion : ''}">`;
    };
    prev();
    q('#ck').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; st.kind = b.dataset.k; $$('#ck button', s.el).forEach(x => x.classList.toggle('on', x === b)); q('#ccatw').hidden = st.kind !== 'display'; q('#cmotion').hidden = st.kind !== 'reel'; q('#cprev').style.aspectRatio = st.kind === 'reel' ? '9/14' : '4/5'; prev(); });
    q('#cstyles').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; st.media = { type: 'art', style: b.dataset.s, seed: st.seed }; st.cat = C.catForStyle(b.dataset.s); if (q('#ccat')) q('#ccat').value = st.cat; $$('#cstyles .chip', s.el).forEach(x => x.classList.toggle('on', x === b)); prev(); });
    q('#cmotion').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; st.motion = b.dataset.m; $$('#cmotion .chip', s.el).forEach(x => x.classList.toggle('on', x === b)); prev(); });
    q('#cshuf').onclick = () => { st.seed = Math.floor(Math.random() * 1e9); st.media = { type: 'art', style: (st.media && st.media.style) || C.pick(Math.random, C.ART_STYLES), seed: st.seed }; prev(); };
    q('#cnone').onclick = () => { st.media = null; prev(); };
    q('#cfile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 20 * 1024 * 1024) { C.toast('Files must be under 20 MB.', 'warn'); return; }
      q('#cprev').innerHTML = '<div class="orb"></div>';
      try { st.media = await S.upload(f); if (st.media.type === 'video') { st.kind = 'reel'; q('#ck [data-k=reel]').click(); } prev(); }
      catch (err) { C.toast(err.message || 'Upload failed', 'warn'); prev(); }
    };
    q('#cai').onclick = async () => {
      const msg = q('#caimsg');
      if (!S.caps.sample) { msg.textContent = 'AI isn’t available in this view.'; return; }
      if (C.aiLeft() <= 0) { msg.textContent = 'Daily AI limit reached — upgrade to Pro for unlimited.'; return; }
      msg.textContent = 'Writing…';
      try {
        const desc = st.media && st.media.type === 'art' ? `a ${C.STYLE_LABELS[st.media.style]} artwork` : st.media ? 'an uploaded creative image' : 'a text post';
        const r = await S.caps.sample(`Write one short, warm social caption (max 25 words) for a creative platform post showing ${desc}. Draft notes from the creator: "${q('#ctext').value.slice(0, 300)}". Add 3 relevant hashtags at the end. Reply with the caption only.`, { modelTier: 'quick' });
        C.aiSpend(); q('#ctext').value = (r.text || '').trim().replace(/^"|"$/g, ''); msg.textContent = '';
      } catch (err) { msg.textContent = err && err.code === 'not_granted' ? 'AI is turned off for this page.' : 'AI is busy — try again.'; }
    };
    q('#cpost').onclick = () => {
      const text = q('#ctext').value.trim();
      if (!text && !st.media) { C.toast('Add a caption or media first.', 'warn'); return; }
      const media = st.media ? { ...st.media, ...(st.kind === 'reel' && st.media.type === 'art' ? { motion: st.motion } : {}) } : null;
      const tags = (text.match(/#[\w-]+/g) || []).map(t => t.slice(1).toLowerCase()).slice(0, 10);
      const post = { id: C.uid(), kind: st.kind, text: text.slice(0, 1000), cat: st.kind === 'display' ? (q('#ccat') || {}).value || st.cat : (media && media.style ? C.catForStyle(media.style) : null), tags, media, group: (q('#cgroup') && q('#cgroup').value) || st.group || null, comp: st.comp || null, ts: Date.now() };
      if (C.addPost(post)) { s.close(); C.toast(st.comp ? 'Entry submitted — good luck! 🏆' : 'Published ✨'); C.confetti(50); o.onDone && o.onDone(post); }
    };
  };

  /* ---------- pin to moodboard (Inspo) ---------- */
  C.A.pin = a => C.pinTo(a.dataset.key);
  C.pinTo = key => {
    if (!C.guardWrite()) return;
    const boards = S.priv.boards || [];
    const s = C.sheet(`<h3>Save to moodboard</h3>
      <div class="menu-list">${boards.map(b => `<button data-b="${esc(b.id)}"><span style="width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;background:var(--beige)">${b.pins[0] ? pinThumb(b.pins[0]) : ''}</span><span class="grow">${esc(b.name)}<br><span class="tiny muted">${b.pins.length} pins</span></span>${b.pins.some(x => x.key === key) ? icon('check') : ''}</button>`).join('') || '<p class="muted small">No boards yet.</p>'}</div>
      <div class="row" style="margin-top:12px"><input class="input" id="nb" placeholder="New board name" maxlength="60"><button class="btn hub" id="nbb">Create</button></div>`);
    const save = id => {
      S.updPriv(v => { const b = v.boards.find(x => x.id === id); if (!b) return; if (!b.pins.some(x => x.key === key)) b.pins.unshift({ id: C.uid(), type: 'post', key, ts: Date.now() }); b.pins = b.pins.slice(0, 120); });
      S.updMine('acts', d => { d.saved = [...new Set([key, ...(d.saved || [])])].slice(0, 500); });
      s.close(); C.toast('Saved to moodboard 📌');
    };
    s.el.querySelector('.menu-list').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b) save(b.dataset.b); });
    s.el.querySelector('#nbb').onclick = () => {
      const name = s.el.querySelector('#nb').value.trim(); if (!name) return;
      const id = C.uid(); S.updPriv(v => { v.boards = v.boards || []; v.boards.unshift({ id, name: name.slice(0, 60), pins: [], ts: Date.now() }); }); save(id);
    };
  };
  const pinThumb = pin => {
    if (pin.type === 'post') { const p = C.post(pin.key); return p && p.media ? (p.media.type === 'manga' ? `<img src="${C.svgURL(C.mangaPanel(p.media.panels[0] || {}))}" alt="">` : C.mediaHTML(p.media)) : ''; }
    if (pin.type === 'color') return `<div style="background:${esc(pin.color)};width:100%;height:100%"></div>`;
    if (pin.type === 'note') return `<div style="background:var(--cream2);width:100%;height:100%"></div>`;
    return pin.media ? C.mediaHTML(pin.media) : '';
  };
  C.pinThumb = pinThumb;
})(window.C);

</script>
<script>
/* js/hubs-a.js */
/* Creovia — Home & Explore, Inspo Hub, Creators Place, Display Hub, Profiles, Groups */
(function (C) {
  'use strict';
  const { esc, icon } = C, S = C.S, V = C.views;
  const greet = () => { const h = new Date().getHours(); return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
  const firstName = () => (C.me().name || 'Creator').split(' ')[0];

  /* ================= HOME & EXPLORE ================= */
  V.home = {
    html() {
      const posts = C.explorePosts().filter(p => p.media);
      const creators = [...new Set([...Object.keys(S.profiles).filter(id => id !== S.uid && S.profiles[id].handle && !(S.profiles[id].privacy && S.profiles[id].privacy.hideFromExplore)), ...C.SAMPLE_CREATORS.map(c => c.id)])].filter(id => !C.isBlocked(id)).slice(0, 14);
      const comps = C.COMPETITIONS.filter(c => !c.past).slice(0, 3);
      return `${C.hero('home', `${greet()}, ${esc(firstName())}.`, 'Your Entire Creative World — discover creators, trends, tools and opportunities.', `<button class="btn glass" data-act="create">${icon('plus')} Create</button><a class="btn glass" href="#ai">${icon('spark')} AI Zone</a><a class="btn glass" href="#flow">${icon('play')} Flow</a>`, C.artURL({ seed: C.hash(S.uid + C.today()), style: 'fluid' }))}
        ${S.note ? `<p class="note">${icon('globe')} ${esc(S.note)}</p>` : ''}
        <div class="sec"><h2>Your hubs</h2></div>
        <div class="hubgrid">${C.HUBS.filter(h => h.id !== 'home').map((h, i) => `<a class="hubtile rise" href="#${h.id}" style="--a:${h.c1};--b:${h.c2};--i:${i}">${icon(h.icon)}<div><b>${esc(h.name)}</b><small>${esc(h.tag)}</small></div></a>`).join('')}</div>
        <div class="sec"><h2>Trending now</h2><button class="more" data-act="search">Search</button></div>
        <div class="ticker">${C.TRENDS.map((t, i) => `<button style="--h:${(i * 41 + 10) % 360}" data-act="tag" data-tag="${t}">${t}</button>`).join('')}</div>
        <div class="sec"><h2>Creators to follow</h2><a class="more" href="#creators">See all</a></div>
        <div class="hscroll">${creators.map(C.creatorCard).join('')}</div>
        <div class="card pad rise" style="margin-top:8px;display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#fff,var(--cream2))">
          <img src="${C.artURL({ seed: C.hash(C.daily()), style: 'brush', w: 160, h: 160 })}" style="width:74px;height:74px;border-radius:18px" alt="">
          <div class="grow"><span class="label-demo">Daily challenge</span><div style="font-family:var(--display);font-size:19px;margin:4px 0">${esc(C.daily())}</div>
          ${S.priv.dailyDone && S.priv.dailyDone[C.today()] ? `<span class="status-pill"><i></i>Done today — nice!</span>` : `<button class="btn sm hub" data-act="daily">Post my entry</button>`}</div></div>
        <div class="sec"><h2>Fresh from the community</h2><a class="more" href="#display">Gallery</a></div>
        <div class="masonry">${posts.slice(0, 16).map(C.tile).join('')}</div>
        <div class="sec"><h2>Competitions</h2><a class="more" href="#compete">All contests</a></div>
        <div class="grid">${comps.map((c, i) => compCard(c, i)).join('')}</div>
        <div class="sec"><h2>Opportunities</h2><span class="label-demo">Sample listings</span></div>
        <div class="card pad">${C.OPPORTUNITIES.map(o => `<div class="list-row"><span class="av" style="--h:${C.hash(o.title) % 360};border-radius:14px">${icon('star')}</span><div class="grow"><b>${esc(o.title)}</b><div class="small muted">${esc(o.who)} · ${esc(o.tag)} · closes in ${o.due} days</div></div><b>${esc(o.pay)}</b></div>`).join('')}
          <p class="tiny muted" style="margin:8px 0 0">These are sample listings to show how opportunities will appear. A real jobs board needs verified clients and payments.</p></div>
        <div class="sec"><h2>Creative tools</h2><a class="more" href="#tools">Open Tools</a></div>
        <div class="hscroll">${C.TOOLS.slice(0, 10).map(t => `<a class="card toolcard lift" style="--tc:${t.color};width:150px;text-decoration:none" href="${t.url}" target="_blank" rel="noopener"><span class="tl">${esc(t.name[0])}</span><b>${esc(t.name)}</b><span class="tiny muted">${esc(t.cat)} ↗</span></a>`).join('')}</div>
        <div class="sec"><h2>Magazines & inspiration</h2><span class="tiny muted">External links</span></div>
        <div class="marquee"><div class="track">${[...C.MAGAZINES, ...C.MAGAZINES].map(m => `<a class="mag" href="${m.url}" target="_blank" rel="noopener"><b>${esc(m.name)}</b><span>${esc(m.topic)} ${icon('ext')}</span></a>`).join('')}</div></div>
        <div class="sec"><h2>Creative brands</h2></div>
        <div class="marquee"><div class="track" style="animation-direction:reverse;animation-duration:50s">${[...C.BRANDS, ...C.BRANDS].map(m => `<a class="mag" href="${m.url}" target="_blank" rel="noopener"><b>${esc(m.name)}</b><span>${esc(m.topic)} ${icon('ext')}</span></a>`).join('')}</div></div>
        <p class="tiny muted" style="text-align:center;margin-top:18px">Creovia isn’t affiliated with the magazines, brands or apps linked here. Links open their own websites.</p>`;
    }
  };
  C.A.daily = () => C.compose({ kind: 'feed', text: `Daily challenge: ${C.daily()} #dailychallenge`, onDone: () => S.updPriv(v => { v.dailyDone = { ...(v.dailyDone || {}), [C.today()]: true }; }) });
  const compCard = (c, i = 0) => {
    const left = Math.max(0, Math.ceil((c.ends - Date.now()) / 864e5));
    return `<div class="comp rise" style="--i:${i}" data-act="comp" data-id="${c.id}"><img src="${C.artURL({ seed: C.hash(c.id), style: c.style })}" alt="">
      <div class="row" style="gap:6px">${c.past ? '<span class="countdown">Ended</span>' : `<span class="countdown">⏳ ${left} days left</span>`}${/sample/.test(c.sponsor) ? '<span class="label-demo on-dark">Sample sponsor</span>' : ''}</div>
      <h3>${esc(c.title)}</h3><span class="small" style="opacity:.9">${esc(c.prize)}</span></div>`;
  };
  C.compCard = compCard;

  /* ================= INSPO HUB ================= */
  C.ui.inspoTab = 'discover'; C.ui.inspoCat = 'all';
  V.inspo = {
    html() {
      const tab = C.ui.inspoTab, boards = S.priv.boards || [];
      let body = '';
      if (tab === 'discover') {
        const cat = C.ui.inspoCat;
        const posts = C.explorePosts().filter(p => p.media && (cat === 'all' || p.cat === cat));
        const cells = []; posts.slice(0, 60).forEach((p, i) => { cells.push(C.tile(p, i)); if (i % 7 === 3) { const pal = C.PALETTES[(i * 3) % C.PALETTES.length]; cells.push(`<div class="tile rise" style="cursor:default"><div class="swatches" style="height:140px;border-radius:0;box-shadow:none">${pal.map(c => `<div style="background:${c}" data-act="pinColor" data-color="${c}" title="Save ${c}"></div>`).join('')}</div><div class="pad small"><b>Palette idea</b> · tap a colour to save it</div></div>`); } });
        body = `<div class="chips">${[{ id: 'all', name: 'All' }, ...C.DISPLAY_CATS].map(c => `<button class="chip ${c.id === cat ? 'on' : ''}" data-act="inspoCat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div><div class="masonry">${cells.join('') || C.empty('No ideas in this category yet.')}</div>`;
      } else {
        body = `<div class="row between" style="margin-bottom:12px"><p class="muted small" style="margin:0">${icon('lock')} Your moodboards are private to you.</p><button class="btn sm hub" data-act="newBoard">${icon('plus')} New board</button></div>
          <div class="grid sm">${boards.map((b, i) => `<div class="rise" style="--i:${i};cursor:pointer" data-act="board" data-id="${esc(b.id)}"><div class="board-cover">${[0, 1, 2].map(k => b.pins[k] ? C.pinThumb(b.pins[k]) : '<span></span>').join('')}</div><b style="display:block;margin-top:8px">${esc(b.name)}</b><span class="small muted">${b.pins.length} pins</span></div>`).join('')}</div>
          ${boards.length ? '' : C.empty('Create your first moodboard and save ideas from anywhere in Creovia.', '<button class="btn hub" data-act="newBoard">Create a board</button>', 'botanical')}`;
      }
      return `${C.hero('inspo', 'Inspo Hub', 'Save ideas, build moodboards and find inspiration in every colour.', `<button class="btn glass" data-act="newBoard">${icon('plus')} New moodboard</button>`, C.artURL({ seed: 7, style: 'botanical', pal: 14 }))}
        <div class="tabs"><button class="${tab === 'discover' ? 'on' : ''}" data-act="inspoTab" data-id="discover">${icon('spark')} Discover</button><button class="${tab === 'boards' ? 'on' : ''}" data-act="inspoTab" data-id="boards">${icon('pin')} My boards · ${boards.length}</button></div>${body}`;
    }
  };
  C.A.inspoTab = a => { C.ui.inspoTab = a.dataset.id; C.render(false); };
  C.A.inspoCat = a => { C.ui.inspoCat = a.dataset.id; C.render(false); };
  C.A.newBoard = C.newBoard = () => {
    if (!C.guardWrite()) return;
    const s = C.sheet(`<h3>New moodboard</h3><label class="field"><span>Name</span><input class="input" id="bn" maxlength="60" placeholder="e.g. Quiet luxury, Sakura OC, Brand refresh"></label><button class="btn hub block" id="bc">Create board</button>`);
    s.el.querySelector('#bc').onclick = () => { const n = s.el.querySelector('#bn').value.trim(); if (!n) return; const id = C.uid(); S.updPriv(v => { v.boards = v.boards || []; v.boards.unshift({ id, name: n.slice(0, 60), pins: [], ts: Date.now() }); }); s.close(); C.go('board', { id }); };
  };
  C.A.pinColor = a => {
    if (!C.guardWrite()) return; const color = a.dataset.color, boards = S.priv.boards || [];
    if (!boards.length) { C.toast('Create a moodboard first.', 'warn'); return C.newBoard(); }
    const s = C.sheet(`<h3>Save ${esc(color)} to…</h3><div class="menu-list">${boards.map(b => `<button data-b="${esc(b.id)}">${icon('pin')} ${esc(b.name)}</button>`).join('')}</div>`);
    s.el.querySelector('.menu-list').onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; S.updPriv(v => { const bd = v.boards.find(x => x.id === b.dataset.b); bd && bd.pins.unshift({ id: C.uid(), type: 'color', color, ts: Date.now() }); }); s.close(); C.toast('Colour saved'); };
  };
  C.A.board = a => C.go('board', { id: a.dataset.id });

  V.board = {
    html({ id }) {
      const b = (S.priv.boards || []).find(x => x.id === id);
      if (!b) return C.empty('This board doesn’t exist anymore.', '<a class="btn" href="#inspo">Back to Inspo</a>');
      const colors = []; b.pins.forEach(p => { if (p.type === 'color') colors.push(p.color); else if (p.type === 'post') { const po = C.post(p.key); if (po && po.media && po.media.type === 'art') colors.push(...C.palOf(po.media).slice(0, 2)); } });
      const pal = [...new Set(colors)].slice(0, 8);
      return `<div class="row" style="margin-bottom:12px"><button class="icon-btn" data-act="go" data-to="inspo" aria-label="Back">${icon('back')}</button><div class="grow"><h1 style="font-family:var(--display);margin:0;font-size:28px">${esc(b.name)}</h1><span class="small muted">${b.pins.length} pins · private</span></div><button class="icon-btn" data-act="boardMenu" data-id="${esc(id)}" aria-label="Board options">${icon('dots')}</button></div>
        ${pal.length ? `<div class="swatches" style="height:70px;margin-bottom:14px">${pal.map(c => `<div style="background:${c};color:${luma(c) > .6 ? '#222' : '#fff'}" data-act="copyHex" data-hex="${c}">${c}</div>`).join('')}</div>` : ''}
        <div class="row wrap" style="margin-bottom:14px"><button class="btn sm light" data-act="boardNote" data-id="${esc(id)}">${icon('text')} Note</button><button class="btn sm light" data-act="boardColor" data-id="${esc(id)}">${icon('palette')} Colour</button><label class="btn sm light">${icon('upload')} Image<input type="file" accept="image/*" hidden data-board-upload="${esc(id)}"></label><a class="btn sm hub" href="#inspo" data-act="inspoTab" data-id="discover">${icon('spark')} Find ideas</a></div>
        <div class="collage">${b.pins.map((p, i) => pinCell(p, id, i)).join('')}</div>${b.pins.length ? '' : C.empty('Empty board. Save posts with the bookmark button, or add notes, colours and images.')}`;
    },
    mount(el, { id }) {
      el.addEventListener('change', async e => {
        const inp = e.target.closest('[data-board-upload]'); if (!inp || !inp.files[0]) return;
        try { const m = await S.upload(inp.files[0]); if (m.type !== 'img') throw new Error('Images only'); S.updPriv(v => { const b = v.boards.find(x => x.id === id); b && b.pins.unshift({ id: C.uid(), type: 'img', media: m, ts: Date.now() }); }); C.toast('Image pinned'); }
        catch (err) { C.toast(err.message, 'warn'); }
      });
    }
  };
  const luma = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16 & 255) * .299 + (n >> 8 & 255) * .587 + (n & 255) * .114) / 255; };
  C.luma = luma;
  const pinCell = (p, bid, i) => {
    const rm = `<button class="icon-btn" style="position:absolute;top:4px;right:4px;background:rgba(255,255,255,.85);width:32px;height:32px" data-act="unpin" data-b="${esc(bid)}" data-p="${esc(p.id)}" aria-label="Remove">${icon('close')}</button>`;
    if (p.type === 'note') return `<div class="card note-pin rise" style="--i:${i};background:${['#FFF4D6', '#FFE5EC', '#E3F6F1', '#ECE8FF'][i % 4]}">${esc(p.text)}${rm}</div>`;
