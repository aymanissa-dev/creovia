    const undo = [], redo = [];
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); ctx.scale(dpr, dpr);
    const W = r.width, H = r.height;
    const fill = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = st.bg; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); };
    fill();
    const snap = () => { undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 25) undo.shift(); redo.length = 0; };
    let drawing = false, last = null;
    const seg = (a, b, w) => {
      const cx = W / 2, cy = H / 2;
      for (let k = 0; k < st.sym; k++) {
        const ang = Math.PI * 2 * k / st.sym;
        for (const mir of st.sym > 1 ? [1, -1] : [1]) {
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.scale(mir, 1); ctx.translate(-cx, -cy);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(a.x, a.y, b.x, b.y); ctx.lineWidth = w; ctx.stroke(); ctx.restore();
        }
      }
    };

    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); snap(); drawing = true; last = pos(e); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = st.tool === 'eraser' ? st.bg : st.color; ctx.globalAlpha = st.tool === 'eraser' ? 1 : st.op; seg(last, { x: last.x + .1, y: last.y + .1 }, st.size * last.p * 1.6); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; evs.forEach(ev => { const p = pos(ev); seg(last, p, st.size * p.p * 1.6); last = p; }); });
    const end = () => { drawing = false; ctx.globalAlpha = 1; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { st.tool = b.dataset.t; el.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); });
    q('#skCols').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; st.color = b.dataset.c; st.tool = 'pen'; el.querySelector('[data-t=pen]').click(); el.querySelectorAll('#skCols .swatch').forEach(x => x.classList.toggle('on', x === b)); };
    q('#skPick').oninput = e => { st.color = e.target.value; el.querySelectorAll('#skCols .swatch').forEach(x => x.classList.remove('on')); };
    q('#skS').oninput = e => { st.size = +e.target.value; q('#skSv').textContent = st.size; };
    q('#skO').oninput = e => { st.op = +e.target.value / 100; };
    q('#skSym').onclick = e => { const b = e.target.closest('[data-n]'); if (!b) return; st.sym = +b.dataset.n; el.querySelectorAll('#skSym .chip').forEach(x => x.classList.toggle('on', x === b)); };
    q('#skBg').onchange = e => { snap(); st.bg = e.target.value; fill(); };
    q('#skU').onclick = () => { if (!undo.length) return; redo.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.putImageData(undo.pop(), 0, 0); };
    q('#skR').onclick = () => { if (!redo.length) return; undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.putImageData(redo.pop(), 0, 0); };
    q('#skC').onclick = async () => { if (await C.confirm('Clear the canvas?', 'Clear', true)) { snap(); fill(); } };
    q('#skSave').onclick = () => {
      if (!C.guardWrite()) return;
      cv.toBlob(async blob => {
        if (!blob) { C.toast('Couldn’t export the sketch.', 'warn'); return; }
        try { const media = await S.upload(new File([blob], 'sketch.jpg', { type: 'image/jpeg' })); C.compose({ kind: 'display', cat: 'artwork', media, text: 'Fresh from the Creovia sketch pad ✏️ #sketch' }); }

    };
  }

          <div class="row wrap" style="justify-content:flex-end">${it.type === 'post' || it.type === 'product' ? `<button class="btn sm danger" data-act="modHide" data-key="${esc(it.target)}" data-r="${esc(it.id)}">Hide</button>` : ''}<button class="btn sm light" data-act="modUser" data-id="${esc(String(it.target).split(':')[0])}" data-r="${esc(it.id)}">Hide account</button><button class="btn sm light" data-act="modDismiss" data-r="${esc(it.id)}">Dismiss</button></div></div>`).join('') || '<p class="small muted">All clear ✨</p>'}</div>
        <div class="card pad" style="margin-top:14px"><b>Hidden content</b>${(S.mod.hiddenPosts || []).map(k => `<div class="list-row"><span class="grow small">Post ${esc(k.split(':')[1] || k)} by ${esc(C.profile(k.split(':')[0]).name)}</span><button class="btn sm light" data-act="modUnhide" data-key="${esc(k)}">Unhide</button></div>`).join('')}
          ${(S.mod.hiddenUsers || []).map(u => `<div class="list-row">${C.avatar(u, 'sm')}<span class="grow small">${esc(C.profile(u).name)} (account)</span><button class="btn sm light" data-act="modUnuser" data-id="${esc(u)}">Unhide</button></div>`).join('') || ((S.mod.hiddenPosts || []).length ? '' : '<p class="small muted">Nothing hidden.</p>')}</div>`;
    }
  };
  const dismiss = id => S.updMod(m => { m.dismissed = [...new Set([...(m.dismissed || []), id])].slice(-1000); });
  C.A.modHide = a => { S.updMod(m => { m.hiddenPosts = [...new Set([...(m.hiddenPosts || []), a.dataset.key])]; m.dismissed = [...new Set([...(m.dismissed || []), a.dataset.r])]; }); C.toast('Hidden for everyone'); };
  C.A.modUser = a => { S.updMod(m => { m.hiddenUsers = [...new Set([...(m.hiddenUsers || []), a.dataset.id])]; m.dismissed = [...new Set([...(m.dismissed || []), a.dataset.r])]; }); C.toast('Account hidden'); };
  C.A.modDismiss = a => dismiss(a.dataset.r);
  C.A.modUnhide = a => S.updMod(m => { m.hiddenPosts = (m.hiddenPosts || []).filter(k => k !== a.dataset.key); });
  C.A.modUnuser = a => S.updMod(m => { m.hiddenUsers = (m.hiddenUsers || []).filter(k => k !== a.dataset.id); });
})(window.C);

</script>
<script>
/* js/intro.js */
/* Creovia — cinematic intro, sign-in / onboarding, calligraphy welcome-back with voice */
(function (C) {
  'use strict';
  const { esc, icon, $ } = C, S = C.S;
  let skipped = false, pend = [];
  const sleep = ms => new Promise(r => { if (skipped) return r(); const t = setTimeout(r, ms); pend.push(() => { clearTimeout(t); r(); }); });
  const doSkip = () => { skipped = true; pend.forEach(f => f()); pend = []; };
  const stage = () => $('#stage');
  const popLetters = (text, delay = 35, base = 0, split = true) => split
    ? C.graphemes(text).map((ch, i) => ch === ' ' ? ' ' : `<span class="letter" style="animation-delay:${base + i * delay}ms">${esc(ch)}</span>`).join('')
    : `<span class="whole" style="animation-delay:${base}ms">${esc(text)}</span>`;

  const MONTAGE = [['fluid', 'Art'], ['fashion', 'Fashion'], ['sunset', 'Photography'], ['manga', 'Anime & Manga'], ['bauhaus', 'Design'], ['neon', 'Animation'], ['paper', 'Crafts'], ['mandala', 'Creativity'], ['sakura', 'Inspiration']];

  /* ---------- Intro: art montage → welcome in every language → logo fills the screen ---------- */
  C.playIntro = async (replay) => {
    skipped = false; pend = [];
    let st = stage();
    if (!st) { st = document.createElement('div'); st.id = 'stage'; document.body.appendChild(st); }
    st.className = ''; st.hidden = false;
    st.innerHTML = `<div class="stage-bg"></div><div class="montage" id="mont"></div><div class="wall" id="wall"></div><div class="center-word" id="cw"></div><div class="logo-in" id="logo"></div><button class="skip" id="skipBtn">Skip intro ›</button>`;
    st.querySelector('#skipBtn').onclick = doSkip;
    const calm = C.reduceMotion();

    // 1. montage of different art
    const mont = st.querySelector('#mont');
    const seed = Math.floor(Math.random() * 1000);
    for (let i = 0; i < MONTAGE.length && !skipped && !calm; i++) {
      const [style, label] = MONTAGE[i];
      const w = Math.max(innerWidth, 400), h = Math.max(innerHeight, 500);
      mont.insertAdjacentHTML('beforeend', `<img class="show" src="${C.artURL({ seed: seed + i, style, w: Math.round(w / 2), h: Math.round(h / 2) })}" alt=""><div class="label">${esc(label)}</div>`);
      const labels = mont.querySelectorAll('.label'); if (labels.length > 1) labels[labels.length - 2].remove();
      await sleep(i < 3 ? 520 : 420);
    }
    mont.style.transition = 'opacity .8s'; mont.style.opacity = '.18'; mont.querySelectorAll('.label').forEach(l => l.remove());

    // 2. welcome, letter by letter, in languages of the world
    const wall = st.querySelector('#wall'), cw = st.querySelector('#cw');
    const W = C.WELCOMES, centerSet = W.slice(0, 11), ambient = W.slice(11).concat(W.slice(1, 11));
    let ai = 0;
    const placeAmbient = () => {
      if (ai >= ambient.length) return;
      const [word, , rtl] = ambient[ai++], top = Math.random() < .5 ? 6 + Math.random() * 28 : 66 + Math.random() * 28;
      const font = C.CALLIGRAPHY[Math.floor(Math.random() * C.CALLIGRAPHY.length)], hue = Math.floor(Math.random() * 360);
      wall.insertAdjacentHTML('beforeend', `<div class="w" dir="${rtl ? 'rtl' : 'auto'}" style="left:${8 + Math.random() * 84}%;top:${top}%;font-size:${16 + Math.random() * 22}px;color:hsl(${hue},85%,72%);font-family:${font},var(--display)">${popLetters(word, 40, 0, !rtl)}</div>`);
    };
    for (let i = 0; i < centerSet.length && !skipped; i++) {
      const [word, lang, rtl] = centerSet[i];
      cw.innerHTML = `<div class="big" dir="${rtl ? 'rtl' : 'auto'}" style="color:hsl(${(i * 47 + 10) % 360},90%,75%)">${popLetters(word, 45, 0, !rtl)}</div><div class="lang">${esc(lang)}</div>`;
      placeAmbient(); placeAmbient();
      await sleep(i === 0 ? 900 : 470);
    }
    while (ai < ambient.length && !skipped) { placeAmbient(); await sleep(60); }
    await sleep(300);

    // 3. Creovia comes in and fills the whole screen
    cw.style.transition = 'opacity .5s, transform .6s'; cw.style.opacity = '0';
    wall.style.transition = 'opacity 1.2s, filter 1.2s'; wall.style.opacity = '.35'; wall.style.filter = 'blur(3px)';
    const logo = st.querySelector('#logo');
    const fill = C.artURL({ seed: 7, style: 'fluid', pal: 4, w: 800, h: 300 });
    logo.innerHTML = `<div class="inner"><div class="word" style="background-image:url('${fill}')">${popLetters('Creovia', 110, 200)}</div><div class="tag">Your Entire Creative World</div></div>`;
    logo.querySelectorAll('.letter').forEach(l => { l.style.backgroundImage = `url('${fill}')`; l.style.backgroundSize = '700% 100%'; l.style.webkitBackgroundClip = 'text'; l.style.backgroundClip = 'text'; l.style.color = 'transparent'; });
    logo.querySelectorAll('.letter').forEach((l, i) => { l.style.backgroundPosition = `${i * 16.6}% 50%`; });
    await sleep(skipped ? 0 : 3300);
    if (replay) { await C.welcomeBack(true); return; }
  };
  C.fadeStage = async () => {
    const st = stage(); if (!st) return;
    st.classList.add('fade-out'); await C.wait(1600); st.hidden = true; st.innerHTML = ''; st.className = '';
  };

  /* ---------- Sign in / onboarding ---------- */
  C.loginFlow = () => new Promise(async resolve => {
    const st = stage();
    const tiles = ['fashion', 'sunset', 'manga', 'fluid', 'neon', 'botanical', 'mandala', 'animesky', 'type', 'bokeh', 'paper', 'sakura', 'kaleido', 'portrait', 'marble', 'pixel'];
    const shell = (inner) => `<div class="login"><div class="art-bg">${tiles.map((s, i) => `<img src="${C.artURL({ seed: i * 13 + 5, style: s, w: 240, h: 300 })}" style="--i:${i}" alt="">`).join('')}</div><div class="glass-card">${inner}</div></div>`;
    const brand = `<div class="row" style="gap:10px"><span class="logo-mark">C</span><span style="font-family:var(--display);font-size:20px">Creovia</span></div>`;
    st.querySelectorAll('.montage,.wall,.center-word,.logo-in,.skip').forEach(n => { n.style.transition = 'opacity .8s'; n.style.opacity = '0'; setTimeout(() => n.remove(), 800); });
    const host = document.createElement('div'); st.appendChild(host);
    host.innerHTML = shell(`${brand}<h1>Welcome</h1><p style="color:#e8dccd;margin:0 0 18px">Connecting securely…</p><div class="skel" style="height:46px;opacity:.3"></div>`);
    await S.whenLoaded;
    const name = (S.profiles[S.uid] && S.profiles[S.uid].name) || '';
    if (S.hasProfile()) {
      host.innerHTML = shell(`${brand}<h1>Welcome back</h1><p style="color:#e8dccd;margin:0 0 18px">Your Entire Creative World is ready.</p>
        <button class="btn hub block" id="go" style="--hub:#E8457F;--hub2:#FFB86B;height:52px;font-size:16px">${C.avatar(S.uid, 'sm')} Continue as ${esc(name.split(' ')[0])}</button>
        <p class="note" style="margin-top:16px">${icon(S.mode === 'cloud' ? 'shield' : 'flag')} <span>${S.mode === 'cloud' ? 'Signed in with your Claude account — secure, and Creovia never sees your password.' : 'Demo mode: your data is saved on this device only. Open Creovia on claude.ai to sign in and sync across devices.'}</span></p>`);
      host.querySelector('#go').onclick = () => { C.welcomeBack(false).then(resolve); };
      return;
    }
    let hue = 18, crafts = new Set();
    const viewOnly = S.mode === 'cloud' && !S.can.write;
    host.innerHTML = shell(`${brand}<h1>Join Creovia</h1><p style="color:#e8dccd;margin:0 0 16px">${S.mode === 'cloud' ? 'You’re signed in with your Claude account. Create your creator profile.' : 'Create a demo profile to explore every hub.'}</p>
      ${viewOnly ? `<p class="note">${icon('lock')} <span>You have view-only access to this Creovia space, so you can explore but not post. Ask the owner to make you a Contributor.</span></p><button class="btn hub block" id="explore" style="margin-top:14px;--hub:#E8457F;--hub2:#FFB86B">Explore Creovia</button>` : `
      <label class="field"><span>Your name</span><input class="input" id="n" maxlength="40" value="${esc(S.meName || '')}" placeholder="e.g. Amani Njeri"></label>
      <label class="field"><span>Handle</span><input class="input" id="h" maxlength="24" placeholder="amani.creates"></label>
      <div class="field"><span>What do you create? (pick a few)</span><div class="row wrap" id="cr" style="gap:6px">${C.CRAFTS.slice(0, 12).map(c => `<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
      <div class="field"><span>Your colour</span><div class="hue-pick" id="hp">${[0, 18, 35, 110, 160, 200, 260, 290, 330].map(h => `<button style="--h:${h}" data-h="${h}" class="${h === hue ? 'on' : ''}" aria-label="Colour"></button>`).join('')}</div></div>
      <button class="btn hub block" id="join" style="height:52px;font-size:16px;--hub:#E8457F;--hub2:#FFB86B">Create my profile ✨</button>
      <p class="note" style="margin-top:14px">${icon(S.mode === 'cloud' ? 'shield' : 'flag')} <span>${S.mode === 'cloud' ? 'Secure sign-in through Claude. Your profile and posts are stored in this Creovia space; moodboards and progress stay private to you.' : 'Demo mode: saved on this device only.'}</span></p>`}`);
    const q = s => host.querySelector(s);
    if (viewOnly) { q('#explore').onclick = () => { C.welcomeBack(false).then(resolve); }; return; }
    const n = q('#n'), h = q('#h');
    const autoHandle = () => { if (!h.dataset.touched) h.value = n.value.toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '').slice(0, 20); };
    n.oninput = autoHandle; h.oninput = () => { h.dataset.touched = 1; }; autoHandle();
    q('#cr').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; const c = b.dataset.c; crafts.has(c) ? crafts.delete(c) : crafts.add(c); b.classList.toggle('on'); };
    q('#hp').onclick = e => { const b = e.target.closest('[data-h]'); if (!b) return; hue = +b.dataset.h; host.querySelectorAll('#hp button').forEach(x => x.classList.toggle('on', x === b)); };
    q('#join').onclick = () => {
      const name = n.value.trim(), handle = h.value.trim().toLowerCase().replace(/[^a-z0-9._]/g, '').slice(0, 24);
      if (!name || handle.length < 2) { C.toastStage('Add your name and a handle (2+ characters).'); return; }
      if (C.checkText(name + ' ' + handle)) { C.toastStage('Please choose a different name.'); return; }
      if (Object.entries(S.profiles).some(([u, p]) => u !== S.uid && p.handle === handle) || C.SAMPLE_CREATORS.some(c => c.handle === handle)) { C.toastStage('That handle is taken — try another.'); return; }
      S.updMine('profiles', d => Object.assign(d, { name: name.slice(0, 40), handle, hue, crafts: [...crafts].slice(0, 8), bio: '', following: [], groups: [], createdAt: Date.now(), privacy: { hideFromExplore: false, comments: 'everyone' } }));
      C.welcomeBack(false, true).then(resolve);
    };
  });
  C.toastStage = msg => { let t = document.getElementById('stageToast'); if (!t) { t = document.createElement('div'); t.id = 'stageToast'; t.className = 'toast warn'; t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:300;width:min(420px,90vw)'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(t._t); t._t = setTimeout(() => t.remove(), 3500); };

  /* ---------- speech: Claude voice (tts) → browser speech → captions only ---------- */
  const speak = text => {
    if (S.priv.voice === false) return Promise.resolve(false);
    const t = S.caps.tts;
    if (t) return t.speak(text, { voice: 'airy', rate: .95, language: 'en' }).then(() => true).catch(() => false);
    try {
      if ('speechSynthesis' in window) {
        return new Promise(res => { const u = new SpeechSynthesisUtterance(text); u.rate = .95; u.pitch = 1.05; u.onend = () => res(true); u.onerror = () => res(false); speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(() => res(false), 12000); });
      }
    } catch (e) { /* not supported */ }
    return Promise.resolve(false);
  };

  /* ---------- Welcome back: name in calligraphy, speaking, then the aesthetic showcase ---------- */
  C.welcomeBack = async (replay, first) => {
    skipped = false; pend = [];
    const st = stage(); st.hidden = false; st.classList.remove('fade-out');
    const nm = (C.me().name && !C.me().ghost ? C.me().name : (S.meName || 'Creator')).split(' ')[0];
    const line = `${first ? 'Welcome' : 'Welcome back'} to Creovia Art Hub, ${nm}. I hope you get inspired by everything that you ever dreamt of. Thank you.`;
    const speaking = speak(line); // started inside the click, so audio is allowed
    st.innerHTML = `<div class="stage-bg"></div><button class="skip" id="skipBtn">Skip ›</button><div class="wb" id="wb"><div class="name" id="nm">${esc(nm)}</div><div class="speech" id="sp"></div><div class="voice-wave" id="vw">${'<i></i>'.repeat(9)}</div></div>`;
    st.querySelectorAll('#vw i').forEach((b, i) => { b.style.animationDelay = (i * .09) + 's'; });
    let done = false; const finish = () => { done = true; };
    st.querySelector('#skipBtn').onclick = () => { doSkip(); finish(); try { S.caps.tts && S.caps.tts.stop(); window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { } };
    const nmEl = st.querySelector('#nm'), sp = st.querySelector('#sp'), vw = st.querySelector('#vw');
    const fonts = C.CALLIGRAPHY;
    vw.classList.add('on');
    speaking.then(() => vw.classList.remove('on'));
    const words = line.split(' ');
    let wi = 0;
    const wordTimer = setInterval(() => { if (wi >= words.length || skipped) { clearInterval(wordTimer); return; } sp.insertAdjacentHTML('beforeend', `<span>${esc(words[wi++])}</span>`); }, 300);
    for (let i = 0; i < 16 && !skipped; i++) {
      nmEl.classList.add('swap'); await sleep(140);
      nmEl.style.fontFamily = `${fonts[i % fonts.length]}, var(--display)`;
      nmEl.style.fontStyle = /Playfair/.test(fonts[i % fonts.length]) ? 'italic' : 'normal';
      nmEl.classList.remove('swap'); await sleep(i < 12 ? 300 : 420);
    }
    nmEl.style.fontFamily = "'Great Vibes', var(--display)";
    await sleep(Math.max(0, words.length * 300 - 16 * 480) + 900);
    clearInterval(wordTimer);
    if (!done) skipped = false;
    // aesthetic showcase
    const cats = ['Aesthetic', 'Fashion', 'Photography', 'Design', 'Creativity', 'Anime & Manga', 'Crafts', 'Animation'];
    const reel = [['fashion', 'Fashion'], ['sunset', 'Photography'], ['type', 'Design'], ['fluid', 'Aesthetic'], ['manga', 'Manga'], ['paper', 'Crafts'], ['neon', 'Animation'], ['bokeh', 'Photography'], ['botanical', 'Botanical'], ['mandala', 'Creativity'], ['sakura', 'Anime'], ['marble', 'Texture']];
    const figs = reel.map(([s, l], i) => `<figure style="--i:${i}"><img src="${C.artURL({ seed: 500 + i, style: s, w: 320, h: 400 })}" alt=""><figcaption>${esc(l)}</figcaption></figure>`).join('');
    const mags = [...C.MAGAZINES, ...C.BRANDS].map(m => `<a href="${m.url}" target="_blank" rel="noopener">${esc(m.name)}</a>`).join('');
    const wb = st.querySelector('#wb'); wb.style.transition = 'opacity .8s, transform .8s'; wb.style.opacity = '0'; wb.style.transform = 'scale(.94)';
    await C.wait(500);
    wb.remove();
    st.insertAdjacentHTML('beforeend', `<div class="showcase"><h2>Get inspired, ${esc(nm)}.</h2><div class="cats">${cats.map((c, i) => `<span style="--i:${i}">${esc(c)}</span>`).join('')}</div>
      <div style="overflow:hidden"><div class="showreel">${figs}${figs}</div></div>
      <div style="overflow:hidden"><div class="mags">${mags}${mags}</div></div>
      <button class="btn hub enter" id="enter" style="--hub:#E8457F;--hub2:#FFB86B;height:54px;padding:0 30px;font-size:17px">Enter Creovia ${icon('spark')}</button></div>`);
    st.querySelector('#skipBtn').textContent = 'Enter ›';
    await new Promise(res => {
      st.querySelector('#enter').onclick = res; st.querySelector('#skipBtn').onclick = res;
      setTimeout(res, C.reduceMotion() ? 2000 : 14000);
    });
    try { S.caps.tts && S.caps.tts.stop(); } catch (e) { }
    await C.fadeStage();
  };
})(window.C);

</script>
<script>
/* js/main.js */
/* Creovia — boot */
(function (C) {
  'use strict';
  const S = C.S;
  let entered = false;
  const enterApp = () => {
    if (entered) return; entered = true;
    const app = document.getElementById('app'); app.hidden = false;
    C.renderShell(); C.inApp = true; C.startRouter();
    S.on(() => { C.updateShell(); C.refresh(); });
  };
  const boot = async () => {
    const initP = S.init();
    await C.playIntro(false);
    await initP;
    await C.loginFlow();
    enterApp();
    if (!S.hasProfile() && S.can.write) setTimeout(() => C.editProfile({ first: true }), 400);
  };
  window.addEventListener('error', e => console.error('Creovia error:', e.message));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.C);

</script>
</body>
